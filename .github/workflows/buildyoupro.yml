name: Build YouPro IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "Bundle ID (Optional)"
        default: "com.google.ios.youtube"
        required: true
        type: string

      opensafari:
        description: "Integrate Open in YouTube (Safari Extension)"
        default: true
        required: false
        type: boolean

      demc:
        description: "Integrate DontEatMyContent"
        default: true
        required: false
        type: boolean

      ytlowcontrastmode:
        description: "Integrate YTLowContrastMode(iOS 15+)"
        default: false
        required: false
        type: boolean

      youpip:
        description: "Integrate YouPiP"
        default: true
        required: false
        type: boolean

      ryd:
        description: "Integrate Return YouTube Dislikes"
        default: true
        required: false
        type: boolean

      ytabconfig:
        description: "Integrate YTABConfig"
        default: true
        required: false
        type: boolean

      youquality:
        description: "Integrate YouQuality"
        default: true
        required: false
        type: boolean

      youchoose:
        description: "Integrate YouChooseQuality"
        default: true
        required: false
        type: boolean

      ytweaks:
        description: "Integrate YTweaks(20.10.4+)"
        default: true
        required: false
        type: boolean

      yougetcaption:
        description: "Integrate YouGetCaption"
        default: true
        required: false
        type: boolean

      youspeed:
        description: "Integrate YouSpeed"
        default: true
        required: false
        type: boolean

      youmute:
        description: "Integrate YouMute"
        default: true
        required: false
        type: boolean

      youloop:
        description: "Integrate YouLoop"
        default: true
        required: false
        type: boolean

      ytuhd:
        description: "Integrate YTUHD(21.25.5+ incompatible)"
        default: false
        required: false
        type: boolean

#      isponsorblock:
#        description: "Integrate iSponsorBlock(21.25.5+ incompatible)"
#        default: false
#        required: false
#        type: boolean

#      ythold:
#        description: "Integrate YTHoldForSpeed"
#        default: false
#        required: false
#        type: boolean

#      nativeshare:
#        description: "Integrate YTNativeShare"
#        default: false
#        required: false
#        type: boolean

#      pleasedontstopthemusic:
#        description: "Integrate PleaseDontStopTheMusic"
#        default: false
#        required: false
#        type: boolean

permissions:
  contents: read

jobs:
  build-tweaks:
    permissions:
      contents: read
    uses: ./.github/workflows/_build_tweaks.yml
    with:
      demc: ${{ inputs.demc }}
      ytlowcontrastmode: ${{ inputs.ytlowcontrastmode }}
      youpip: ${{ inputs.youpip }}
      ytuhd: ${{ inputs.ytuhd }}
      ryd: ${{ inputs.ryd }}
      ytabconfig: ${{ inputs.ytabconfig }}
      youquality: ${{ inputs.youquality }}
      ytweaks: ${{ inputs.ytweaks }}
      youchoose: ${{ inputs.youchoose }}
      yougetcaption: ${{ inputs.yougetcaption }}
      youspeed: ${{ inputs.youspeed }}
      youmute: ${{ inputs.youmute }}
      youloop: ${{ inputs.youloop }}
      opensafari: ${{ inputs.opensafari }}
#     isponsorblock: ${{ inputs.isponsorblock }}
#     ythold: ${{ inputs.ythold }}
#     nativeshare: ${{ inputs.nativeshare }}
#     pleasedontstopthemusic: ${{ inputs.pleasedontstopthemusic }}

  package:
    needs: build-tweaks
    permissions:
      contents: write
    uses: ./.github/workflows/_package.yml
    with:
      ipa_url: ${{ inputs.ipa_url }}
      display_name: ${{ inputs.display_name }}
      bundle_id: ${{ inputs.bundle_id }}
      opensafari: ${{ inputs.opensafari }}
      main: youpro
      ipa_prefix: YouProExtra
      release_prefix: youproextra-ipa
      title: "Build YouPro IPA"
